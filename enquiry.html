<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Document initialization and standard character setting -->
    <meta charset="UTF-8">
    
    <!-- Slide Page 10: Enforcing device rendering scale parameters to optimize smartphone views -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Product Enquiry - Wildflower & Wax</title>
    
    <!-- Linking our master central cascading design template rules sheet -->
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>

    <!-- Unified brand banner header component containing site links -->
    <header>
        <h2>Wildflower & Wax</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Shop</a>
            <a href="about.html">About</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Main workspace block housing the specialized client booking container -->
    <main>
        <section style="max-width: 600px; margin: 0 auto;">
            <h1>Product Enquiry</h1>
            
            <!-- Standard form entry processing custom stockist request parameters -->
            <form action="enquiry.html" onsubmit="alert('Enquiry submitted successfully!');">
                
                <label>Full Name:</label>
                <input type="text" required placeholder="Enter your full name">
                
                <label>Email Address:</label>
                <input type="email" required placeholder="Enter your email address">
                
                <label>Select Candle:</label>
                <select>
                    <option>Blushing Rose Sculpture</option>
                    <option>Citrus Grove Elements</option>
                    <option>Muted Rose Pillar Trio</option>
                    <option>Neon Wave Ribbon</option>
                </select>
                
                <label>Your Message:</label>
                <textarea rows="4" required placeholder="Type your message here..."></textarea>
                
                <button type="submit" class="add-btn">Submit Request</button>
            </form>
        </section>
    </main>

    <!-- Corporate baseline page tracking footer nodes -->
    <footer>
        <p>&copy; 2026 Wildflower & Wax. All Rights Reserved.</p>
    </footer>

</body>
</html>
